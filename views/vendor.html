<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="js/vendor.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <title>WasteLesss Project - Vendors</title>
  </head>

  <body>
    <div class="topnav">
      <a class="active" href="./login.html">Login</a>
      <a class="active" href="./index.html">Home</a>
      <a class="active" href="./inventory.html">Inventory</a>
      <a class="active" href="./companyDivision.html">Company Division</a>
      <a class="active" href="./vendor.html">Vendors</a>
    </div>

    <br />
    <div class="wrapper">
      <button id="getVendor" class="btn">Get Vendors</button>
      <div id="output"></div>
      <br />

      <h2>Add New Vendors</h2>
      <form id="vendorForm" class="vendor-form">
        <div class="input-box">
          <label for="vendorid">Vendor ID (for update only):</label>
          <input type="number" id="vendorid" />
        </div>
        <div class="input-box">
          <label for="vendorname">Vendor Name:</label
          ><input type="text" id="vendorname" required />
        </div>
        <div class="input-box">
          <label for="contactinfo">Contact Info:</label
          ><input type="text" id="contactinfo" required />
        </div>
        <div class="input-box">
          <label for="address">Address:</label
          ><input type="text" id="address" required />
        </div>

        <button type="submit" class="btn">Add Vendor</button>
      </form>

      <div id="postResult"></div>
    </div>
  </body>
</html>
