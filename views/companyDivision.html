<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasteLesss Project - Company Division</title>
    <script defer src="js/companyDivision.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"/>
    <link href="http://localhost:3444/api/companydivision" />
  </head>

  <body>
    <div class="topnav">
      <a class="active" href="./login.html">Login</a>
      <a class="active" href="./index.html">Home</a>
      <a class="active" href="./inventory.html">Inventory</a>
      <a class="active" href="./companyDivision.html">Company Division</a>
      <a class="active" href="./vendor.html">Vendors</a>
    </div>
    <br />
    <div class="wrapper">
      <button id="getCompanyDivision" class="btn">Get Company Division</button>
      <div id="output"></div>
      <br />

      <h2>Company Divisions</h2>
      <form id="companyDivisionForm" class="companyDivision-form">
        <div class="input-box">
          <label for="divisionid">Division ID (for update only):</label>
          <input type="number" id="divisionid" />
        </div>
        <div class="input-box">
          <label for="divisionname">Division Name:</label
          ><input type="text" id="divisionname" required />
        </div>
        <div class="input-box">
          <label for="manager">Manager:</label
          ><input type="text" id="manager" required />
        </div>
        <button type="submit" class="btn">Add Company Division</button>
      </form>

      <div id="postResult"></div>
    </div>
  </body>
</html>
